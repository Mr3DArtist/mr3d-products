<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mr3D Product Cards</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: only light; }
    html, body { background: transparent; }
    body { margin: 0; font-family: system-ui, sans-serif; }
    main { display: flow-root; padding-inline: clamp(8px, 1.8vw, 24px); }
    .product-outline {
      --outline: rgba(55, 201, 255, .7);
      --strip-padding: clamp(4px, .45vw, 9px);
      --strip-inset: calc(var(--strip-padding) + 1px);
      --tile-gap: clamp(3px, .55vw, 11px);
      --outline-radius: clamp(12px, 1.75vw, 35px);
      position: relative;
      margin-block: clamp(16px, 1.15vw, 24px);
    }
    .product-outline-shape {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }
    .product-outline-shape use { fill: none; }
    .product-outline-halo { stroke: #0099ff; stroke-width: 6; opacity: .23; }
    .product-outline-glow { stroke: #1db1ff; stroke-width: 2.5; opacity: .4; }
    .product-outline-line { stroke: var(--outline); }
    .product-slot {
      position: relative;
      display: grid;
      place-items: center;
      grid-column: 6 / span 2;
      grid-row: 2;
      min-width: 0;
      aspect-ratio: 1;
      margin-inline: calc(-1 * var(--strip-inset));
      border: 1px solid transparent;
      border-top: 0;
      border-radius: 0 0 var(--outline-radius) var(--outline-radius);
      padding: var(--strip-padding);
      container-type: inline-size;
    }
    .product-slot .g-thumb { width: 100%; }
    .product-slot img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .gallery-track {
      display: grid;
      position: relative;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: calc(var(--strip-inset) - 1px) var(--tile-gap);
      list-style: none;
      margin: 0;
      padding: var(--strip-inset) var(--strip-inset) 0;
    }
    .g-card { grid-column: span 2; container-type: inline-size; }
    .g-thumb { display: block; color: inherit; }
    .g-thumb:focus-visible { outline: 2px solid #37c9ff; outline-offset: 2px; }
    .g-frame {
      position: relative;
      display: block;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 8.5cqw;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14);
    }
    .g-ph { display: block; height: 100%; transition: transform .55s ease; }
    .g-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: inherit;
      pointer-events: none;
    }
    .g-thumb:hover .g-ph { transform: scale(1.08); }
    .g-ph-tag {
      position: absolute;
      right: .35em;
      bottom: .24em;
      padding: .28em .45em;
      border: .06em solid #dadade;
      border-radius: 1em;
      background: linear-gradient(140deg, #171717, #3f3f46);
      color: white;
      font-size: 6cqw;
      font-weight: 750;
      line-height: 1.35;
      letter-spacing: .035em;
      text-transform: uppercase;
    }
    @media (prefers-reduced-motion: reduce) {
      .g-ph { transition: none; }
      .g-thumb:hover .g-ph { transform: none; }
    }
  </style>
</head>

      function drawOutline() {
        const bounds = outline.getBoundingClientRect();
        const topTile = firstTile.getBoundingClientRect();
        const lower = lowerSlot.getBoundingClientRect();
        const left = .5;
        const top = .5;
        const right = bounds.width - .5;
        const bottom = lower.bottom - bounds.top - .5;
        const shelf = topTile.bottom + (topTile.top - bounds.top) - bounds.top - .5;
        const slotLeft = lower.left - bounds.left + .5;
        const slotRight = lower.right - bounds.left - .5;
        const corner = parseFloat(getComputedStyle(lowerSlot).borderBottomLeftRadius);
        const radius = Math.min(corner, (slotRight - slotLeft) / 2, (bottom - shelf) / 2, (shelf - top) / 2);
        if (!(radius > 0)) return;

        const arc = (x, y, sweep = 1) => `A ${radius} ${radius} 0 0 ${sweep} ${x} ${y}`;
        path.setAttribute('d', [
          `M ${left + radius} ${top}`, `H ${right - radius}`, arc(right, top + radius),
          `V ${shelf - radius}`, arc(right - radius, shelf),
          `H ${slotRight + radius}`, arc(slotRight, shelf + radius, 0),
          `V ${bottom - radius}`, arc(slotRight - radius, bottom),
          `H ${slotLeft + radius}`, arc(slotLeft, bottom - radius),
          `V ${shelf + radius}`, arc(slotLeft - radius, shelf, 0),
          `H ${left + radius}`, arc(left, shelf - radius),
          `V ${top + radius}`, arc(left + radius, top), 'Z',
        ].join(' '));
      }

      let lastHeight = 0;
      function update() {
        drawOutline();
        const height = Math.ceil(strip.getBoundingClientRect().height);
        if (window.parent === window || height === lastHeight) return;

        lastHeight = height;
        window.parent.postMessage({ type: 'mr3d-products:height', height }, '*');
      }
      update();
      const observer = new ResizeObserver(update);
      observer.observe(strip);
    })();
  </script>
</body>
</html>
