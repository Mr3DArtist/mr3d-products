<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mr3D Product Cards</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: only light; }
    html, body { background: transparent; }
    body { margin: 0; font-family: system-ui, sans-serif; }
    .m3-wrap {
      width: 100%;
      margin: clamp(8px, .9vw, 18px) 0;
      padding: clamp(4px, .45vw, 9px);
      border: 1px solid rgba(55, 201, 255, .7);
      border-radius: clamp(12px, 1.75vw, 35px);
      box-shadow: 0 0 9px rgba(29, 177, 255, .32), 0 0 24px rgba(0, 153, 255, .18),
                  inset 0 0 8px rgba(55, 201, 255, .12);
    }
    .gallery-track {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: clamp(3px, .55vw, 11px);
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .g-card { container-type: inline-size; }
    .g-thumb { display: block; color: inherit; }
    .g-thumb:focus-visible { outline: 2px solid #37c9ff; outline-offset: 2px; }
    .g-frame {
      position: relative;
      display: block;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 8.5cqw;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14);
    }
    .g-ph { display: block; height: 100%; transition: transform .55s ease; }
    .g-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: inherit;
      pointer-events: none;
    }
    .g-thumb:hover .g-ph { transform: scale(1.08); }
    .g-ph-tag {
      position: absolute;
      right: .35em;
      bottom: .24em;
      padding: .28em .45em;
      border: .06em solid #dadade;
      border-radius: 1em;
      background: linear-gradient(140deg, #171717, #3f3f46);
      color: white;
      font-size: 6cqw;
      font-weight: 750;
      line-height: 1.35;
      letter-spacing: .035em;
      text-transform: uppercase;
    }
    @media (prefers-reduced-motion: reduce) {
      .g-ph { transition: none; }
      .g-thumb:hover .g-ph { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="m3-wrap">
      <ul class="gallery-track" aria-label="More from Mr3D">
          <li class="g-card">
            <a class="g-thumb" href="https://superhivemarket.com/products/auto-face-mocap-pro?ref=473" target="_blank" rel="noopener noreferrer">
              <span class="g-frame">
                <span class="g-ph gp-5" >
                  <img src="https://mr3dpageclips.carrd.co/assets/images/image16.jpg?v=a689dffb" alt="Auto Face MoCap Pro" style="width:100%;height:100%;object-fit:cover;display:block;" />
                </span>
                <span class="g-ph-tag hot">Flagship</span>
              </span>
            </a>
          </li>
          <li class="g-card">
            <a class="g-thumb" href="https://superhivemarket.com/products/gobos-master?ref=473" target="_blank" rel="noopener">
              <span class="g-frame">
                <span class="g-ph gp-1" >
                  <img src="https://mr3d.carrd.co/assets/images/image06.jpg?v=c88b4758" alt="Gobos Master" style="width:100%;height:100%;object-fit:cover;display:block;" />
                </span>
                <span class="g-ph-tag hot">Featured</span>
              </span>
            </a>
          </li>
          <li class="g-card">
            <a class="g-thumb" href="https://superhivemarket.com/products/decalify?ref=473" target="_blank" rel="noopener">
              <span class="g-frame">
                <span class="g-ph gp-2" >
                  <img src="https://mr3d.carrd.co/assets/images/image07.jpg?v=c88b4758" alt="Decalify" style="width:100%;height:100%;object-fit:cover;display:block;" />
                </span>
              </span>
            </a>
          </li>
          <li class="g-card">
            <a class="g-thumb" href="https://superhivemarket.com/products/true-dark-blender-themes-pack?ref=473" target="_blank" rel="noopener">
              <span class="g-frame">
                <span class="g-ph gp-3" >
                  <img src="https://mr3d.carrd.co/assets/images/image02.jpg?v=c88b4758" alt="True Dark Themes Pack" style="width:100%;height:100%;object-fit:cover;display:block;" />
                </span>
              </span>
            </a>
          </li>
          <li class="g-card">
            <a class="g-thumb" href="https://superhivemarket.com/products/tabflow?ref=473" target="_blank" rel="noopener noreferrer">
              <span class="g-frame">
                <span class="g-ph gp-6" >
                  <img src="https://mr3dpageclips.carrd.co/assets/images/image17.jpg?v=c5be56da" alt="TabFlow" style="width:100%;height:100%;object-fit:cover;display:block;" />
                </span>
                <span class="g-ph-tag hot">Time-Saver</span>
              </span>
            </a>
          </li>
          <li class="g-card">
            <a class="g-thumb" href="https://superhivemarket.com/creators/mr3d?ref=473" target="_blank" rel="noopener">
              <span class="g-frame">
                <span class="g-ph gp-4" >
                  <img src="https://mr3d.carrd.co/assets/images/image08.gif?v=c88b4758" alt="Coming Soon" style="width:100%;height:100%;object-fit:cover;display:block;" />
                </span>
              </span>
            </a>
          </li>
        </ul>
    </div>
  </main>
</body>
</html>
